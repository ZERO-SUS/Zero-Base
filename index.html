<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ZERO BASE — Water-Tank Cleaning Business Management Platform" />
    <link rel="icon" type="image/png" href="/assets/zero-base-logo.png" />
    <title>ZERO BASE</title>
    <script>
      (function () {
        try {
          var mode = localStorage.getItem('zb_theme_mode') || 'system';
          var accent = localStorage.getItem('zb_accent_color') || '#2563EB';
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = mode === 'dark' || (mode === 'system' && prefersDark);
          var root = document.documentElement;
          if (isDark) root.classList.add('dark');
          else root.classList.remove('dark');
          if (/^#[0-9A-Fa-f]{6}$/.test(accent)) {
            root.style.setProperty('--zb-accent', accent);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-bg text-text-primary antialiased selection:bg-accent-soft selection:text-text-primary">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
